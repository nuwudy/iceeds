<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1200" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans', Arial, sans-serif;">
  <defs>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="850" height="1200" fill="#ffffff"/>
  <rect width="850" height="1200" fill="url(#gridPattern)" opacity="0.6"/>

  <!-- Official Border with Corner Ornaments -->
  <rect x="25" y="25" width="800" height="1150" rx="8" fill="none" stroke="#047857" stroke-width="2.5"/>
  <rect x="33" y="33" width="784" height="1134" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Top Legal Ribbon -->
  <g transform="translate(425, 75)" text-anchor="middle">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#065f46"/>
    <text x="0" y="5" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="2">CERTIFIED TRUE ENGLISH TRANSLATION</text>
  </g>

  <!-- Legal Header -->
  <text x="425" y="140" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="3" fill="#64748b">OFFICE OF THE SWORN TRANSLATOR &amp; NOTARY PUBLIC</text>
  <text x="425" y="165" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">GOVERNMENT OF INDIA LEGAL ATTESTATION DESK</text>
  <text x="425" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">ADVOCATE &amp; NOTARY (APPOINTED UNDER NOTARIES ACT, 1952)</text>
  <line x1="80" y1="200" x2="770" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Certificate of Translation Statement -->
  <rect x="65" y="215" width="720" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="85" y="238" font-size="11" font-weight="bold" fill="#0f172a">SWORN TRANSLATION CERTIFICATE &bull; REF: <tspan font-family="monospace" fill="#047857">NOTARY/ENG-TRANS/2026/ICEEDS-DYSP</tspan></text>
  <text x="85" y="258" font-size="10.5" fill="#475569">
    I hereby certify that this is a true, authentic, and verbatim English translation of the official Police Enquiry Report
    issued in Malayalam by the Office of the Deputy Superintendent of Police, Malappuram, Kerala State.
  </text>

  <!-- Body Container: English Translation Content -->
  <g transform="translate(65, 290)">
    <rect x="0" y="0" width="720" height="740" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="0" y="0" width="720" height="42" rx="8" fill="#0f172a"/>
    <text x="25" y="26" font-size="12.5" font-weight="bold" fill="#f8fafc" letter-spacing="1">
      OFFICIAL REPORT: KERALA POLICE &bull; DEPUTY SUPERINTENDENT OF POLICE, MALAPPURAM
    </text>

    <g transform="translate(25, 60)" font-size="11" fill="#1e293b">
      <!-- Office Details -->
      <text x="0" y="0" font-weight="bold" fill="#0369a1">Office of the Deputy Superintendent of Police, Malappuram, Kerala. PIN: 676505</text>
      <text x="0" y="16" fill="#64748b">Phone: 0483 2734992 &bull; Email: dyspmpm.pol@kerala.gov.in &bull; Date: 29.04.2026</text>
      <text x="0" y="32" font-weight="bold" fill="#0f172a">File No: No. 43/CMO/SDOM/2026</text>

      <line x1="0" y1="42" x2="670" y2="42" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Subject & Reference -->
      <text x="0" y="58" font-weight="bold" fill="#64748b">RECIPIENT:</text>
      <text x="90" y="58" fill="#0f172a">Navas K.M., 52/26, S/o Ali, Kuzhikkadavil House, Uliyannoor PO, Aluva, Ernakulam. Ph: 8590093535</text>

      <text x="0" y="78" font-weight="bold" fill="#64748b">SUBJECT:</text>
      <text x="90" y="78" font-weight="bold" fill="#0f172a">Regarding the petition submitted by you before the Hon'ble Chief Minister of Kerala State.</text>

      <text x="0" y="96" font-weight="bold" fill="#64748b">REFERENCE:</text>
      <text x="90" y="96" font-family="monospace" fill="#047857">No. G3(d) - 43998/2026/MM Dated 27.04.2026</text>

      <line x1="0" y1="108" x2="670" y2="108" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Body Narrative -->
      <text x="0" y="125" fill="#334155">Attention is invited to the subject and reference cited above. The petition submitted by you before the</text>
      <text x="0" y="141" fill="#334155">Hon'ble Chief Minister of Kerala State regarding the operational permissions, approvals, and accreditations</text>
      <text x="0" y="157" fill="#334155">of <tspan font-weight="bold" fill="#0f172a">I-CEEDS (Innovation Council for Exquisite Education and Development of Skills)</tspan> situated at Athanikkal,</text>
      <text x="0" y="173" fill="#334155">Valluvambram in Malappuram District was received at this office for detailed official enquiry.</text>

      <text x="0" y="197" fill="#334155">Statements of both the petitioner and the respondent (opposite party) were duly recorded, and a comprehensive</text>
      <text x="0" y="213" fill="#334155">investigation was conducted by scrutinizing all statutory records and official documents submitted by the institution.</text>

      <!-- Key Determinations -->
      <rect x="0" y="230" width="670" height="235" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="250" font-weight="bold" fill="#0f172a" font-size="11.5">KEY VERIFIED DETERMINATIONS &amp; LEGAL STATUTORY FINDINGS:</text>

      <text x="15" y="272" font-weight="bold" fill="#047857">1. Indian Trusts Act, 1882:</text>
      <text x="195" y="272" fill="#334155">Duly registered under Reg. No. 60/IV/2023 Dtd 17.04.2023 at Sub-Registrar Office, Perumbavoor.</text>

      <text x="15" y="294" font-weight="bold" fill="#047857">2. Govt. of India / NSDC:</text>
      <text x="195" y="294" fill="#334155">Accredited training partner under Ministry of Skill Dev. &amp; Entrepreneurship (via Vemosa Skills</text>
      <text x="195" y="310" fill="#334155">Pvt Ltd, Serial No. 2006 Dtd 24.03.2025, valid from 24.03.2025 to 24.03.2027) for skill courses.</text>

      <text x="15" y="332" font-weight="bold" fill="#047857">3. Embassy Attestations:</text>
      <text x="195" y="332" fill="#334155">Candidates completing training at I-CEEDS have successfully obtained verified Embassy Attestations.</text>

      <text x="15" y="354" font-weight="bold" fill="#047857">4. Enterprise License:</text>
      <text x="195" y="354" fill="#334155">Valid Certificate of Enterprises License issued by Pookkottur Grama Panchayat under License No.</text>
      <text x="195" y="370" fill="#334155">BFIF01-G100604-00040-2026 (Valid 18.03.2026 to 17.03.2028) for Consultancy, Training &amp; Tutorial Centre.</text>

      <text x="15" y="392" font-weight="bold" fill="#047857">5. International ISO:</text>
      <text x="195" y="392" fill="#334155">Possesses ISO accreditations from EGAC, EIAC, Euro UK Accreditation, and US ISO Certification.</text>

      <text x="15" y="414" font-weight="bold" fill="#047857">6. UK Study Centre:</text>
      <text x="195" y="414" fill="#334155">I-CEEDS is an authorized and accredited Study Centre of FICS UK.</text>

      <text x="15" y="436" font-weight="bold" fill="#047857">7. NITI Aayog NGO Darpan:</text>
      <text x="195" y="436" fill="#334155">Registered NGO under NITI Aayog, Govt. of India, Darpan ID: KL/2023/0348375 Dtd 27.11.2023.</text>

      <!-- Conclusion -->
      <rect x="0" y="475" width="670" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="15" y="495" font-weight="bold" fill="#065f46" font-size="11">OFFICIAL POLICE ENQUIRY CONCLUSION &amp; DISPOSITION:</text>
      <text x="15" y="512" fill="#065f46" font-size="10.5">
        Upon thorough verification of all documents produced, the legality, valid approvals, and legitimate operation of
        the institution are prima facie established and confirmed. You are hereby informed accordingly.
      </text>

      <!-- Signatory Block -->
      <g transform="translate(380, 535)">
        <text x="0" y="20" font-size="11" fill="#64748b">Yours faithfully,</text>
        <text x="0" y="40" font-size="12" font-weight="bold" fill="#0f172a">(Sd/-) SUBHASH BABU K. C.</text>
        <text x="0" y="56" font-size="11" font-weight="bold" fill="#0369a1">Deputy Superintendent of Police (DySP)</text>
        <text x="0" y="72" font-size="10.5" fill="#334155">Malappuram District, Kerala State</text>
        <text x="0" y="88" font-size="10.5" font-mono fill="#64748b">Date: 29.04.2026</text>
      </g>

      <!-- Round Seal Stamp Simulation -->
      <g transform="translate(120, 580)">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 2"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="#1d4ed8" stroke-width="1.2"/>
        <text x="50" y="38" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#1d4ed8" letter-spacing="0.5">DY. SUPDT. OF POLICE</text>
        <text x="50" y="52" text-anchor="middle" font-size="9" font-weight="900" fill="#1d4ed8">MALAPPURAM</text>
        <text x="50" y="66" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">PIN: 676 505</text>
      </g>
    </g>
  </g>

  <!-- Bottom Attestation Footer -->
  <g transform="translate(65, 1045)" font-size="10" fill="#64748b">
    <rect x="0" y="0" width="720" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="22" font-weight="bold" fill="#0f172a">OFFICIAL NOTARIAL REGISTRATION &amp; SEAL:</text>
    <text x="20" y="40">Attested and certified under Section 8 of the Notaries Act, 1952 (Act No. 53 of 1952), Government of India.</text>
    <text x="20" y="56">Verified document hash: SHA256-KERALA-POLICE-REPORT-MALAPPURAM-SDOM-2026 &bull; Status: Irrevocable Record</text>
  </g>
</svg>
